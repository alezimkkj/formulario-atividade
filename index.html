<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Formulário DOM</title>
</head>
<body>
    <form>
        <label>
            Nome Completo: <input type="text" name="nome" id="nome">
        </label>

        <br><br>

        <label>
            E-mail Institucional: <input type="email" name="email" id="email">
        </label>

        <br><br>

        <label>
            Senha de Acesso: <input type="password" name="senha" id="senha">
        </label>

        <br><br>

        <label>
            Confirmação de Senha: <input type="password" name="confirmaSenha" id="senhaConfirm">
        </label>

        <br><br>

        <label>
            Perfil Técnico:
            <select name="perfil" id="perfil">
                <option value="front-end">Front-End</option>
                <option value="back-end">Back-End</option>
            </select>
        </label>

        <br><br>

        <label>
            Termos de Uso:
            <input type="checkbox" name="termos" id="termos">
        </label>
    </form>
</body>
</html>
